<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e3dcff">
<title>Сәлем, досым!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="sky" id="sky" aria-hidden="true">
  <div class="glow a"></div>
  <div class="glow b"></div>
</div>

<div class="topbar">
  <div class="lang" role="group" aria-label="Тіл / Язык">
    <button type="button" data-lang="kk">ҚАЗ</button>
    <button type="button" data-lang="ru">РУС</button>
  </div>
</div>

<main id="app">
  <!-- Приветствие + вход ученика (утверждённая надпись и кошечка сохранены) -->
  <section class="view welcome" data-view="home">
    <h1 class="hello" id="hello" data-i18n-aria="hello"></h1>

    <div class="kitty" id="homeKitty" role="img" data-i18n-aria="catAria">
      <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="gFur" cx="38%" cy="30%" r="75%">
            <stop offset="0" stop-color="#ffe6d3"/>
            <stop offset=".6" stop-color="#ffcfae"/>
            <stop offset="1" stop-color="#f6b28c"/>
          </radialGradient>
          <radialGradient id="gEye" cx="50%" cy="70%" r="70%">
            <stop offset="0" stop-color="#6b4f8e"/>
            <stop offset=".55" stop-color="#3a2742"/>
            <stop offset="1" stop-color="#241827"/>
          </radialGradient>
          <linearGradient id="gEar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb3c6"/>
            <stop offset="1" stop-color="#ffd6e0"/>
          </linearGradient>
        </defs>

        <ellipse cx="150" cy="302" rx="92" ry="12" fill="#8a5d9c" opacity=".16"/>

        <!-- хвостик -->
        <g class="part k-tail">
          <path d="M196 284 C238 288 262 262 258 228 C255 204 240 192 232 200 C226 207 238 214 240 230 C243 254 226 268 196 266 Z"
                fill="url(#gFur)" stroke="var(--fur-line)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M247 214 C252 222 253 232 251 240" stroke="var(--fur-dark)" stroke-width="5" stroke-linecap="round" fill="none"/>
        </g>

        <!-- тело -->
        <g class="part k-body">
          <path d="M150 162 C202 162 222 232 217 268 C214 292 192 298 150 298 C108 298 86 292 83 268 C78 232 98 162 150 162 Z"
                fill="url(#gFur)" stroke="var(--fur-line)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="150" cy="250" rx="38" ry="40" fill="var(--cream)"/>
          <ellipse cx="118" cy="290" rx="22" ry="12" fill="#ffd9bd" stroke="var(--fur-line)" stroke-width="3"/>
          <path d="M111 286 v6 M121 286 v6" stroke="var(--fur-line)" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="184" cy="290" rx="22" ry="12" fill="#ffd9bd" stroke="var(--fur-line)" stroke-width="3"/>
          <path d="M179 286 v6 M189 286 v6" stroke="var(--fur-line)" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="122" cy="252" rx="15" ry="20" fill="#ffd9bd" stroke="var(--fur-line)" stroke-width="3"/>
        </g>

        <!-- голова -->
        <g class="part k-head">
          <g class="part k-ear-l">
            <path d="M80 102 C72 62 78 36 90 28 C106 32 126 50 136 66 Z" fill="url(#gFur)" stroke="var(--fur-line)" stroke-width="3" stroke-linejoin="round"/>
            <path d="M91 88 C87 62 89 46 95 41 C105 47 117 58 123 68 Z" fill="url(#gEar)"/>
          </g>
          <g class="part k-ear-r">
            <path d="M220 102 C228 62 222 36 210 28 C194 32 174 50 164 66 Z" fill="url(#gFur)" stroke="var(--fur-line)" stroke-width="3" stroke-linejoin="round"/>
            <path d="M209 88 C213 62 211 46 205 41 C195 47 183 58 177 68 Z" fill="url(#gEar)"/>
          </g>

          <ellipse cx="150" cy="126" rx="88" ry="68" fill="url(#gFur)" stroke="var(--fur-line)" stroke-width="3"/>
          <path d="M138 62 q4 12 0 20 M150 59 q0 14 0 24 M162 62 q-4 12 0 20" stroke="var(--fur-dark)" stroke-width="5" stroke-linecap="round" fill="none"/>
          <ellipse cx="150" cy="152" rx="36" ry="24" fill="var(--cream)"/>

          <!-- глаза -->
          <g class="k-eye">
            <ellipse cx="112" cy="124" rx="18" ry="22" fill="url(#gEye)"/>
            <circle cx="105" cy="114" r="7" fill="#fff"/>
            <circle cx="119" cy="132" r="3.2" fill="#fff" opacity=".9"/>
          </g>
          <g class="k-eye">
            <ellipse cx="188" cy="124" rx="18" ry="22" fill="url(#gEye)"/>
            <circle cx="181" cy="114" r="7" fill="#fff"/>
            <circle cx="195" cy="132" r="3.2" fill="#fff" opacity=".9"/>
          </g>

          <ellipse cx="94" cy="154" rx="15" ry="8.5" fill="var(--blush)" opacity=".6"/>
          <ellipse cx="206" cy="154" rx="15" ry="8.5" fill="var(--blush)" opacity=".6"/>

          <path d="M142 141 Q150 136 158 141 Q153 149 150 149 Q147 149 142 141 Z" fill="#ff8aa5"/>
          <path d="M150 149 v4 M134 152 Q142 163 150 153 Q158 163 166 152" stroke="#7a3e4e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M144 158 Q150 167 156 158 Q150 161 144 158 Z" fill="#ff8aa5"/>

          <g stroke="#c98a70" stroke-width="2" stroke-linecap="round" opacity=".8">
            <path d="M96 146 L64 140 M95 153 L62 155 M97 160 L67 169"/>
            <path d="M204 146 L236 140 M205 153 L238 155 M203 160 L233 169"/>
          </g>
        </g>

        <!-- бантик -->
        <g transform="translate(150 197)">
          <path d="M0 0 L-20 -11 Q-26 0 -20 11 Z M0 0 L20 -11 Q26 0 20 11 Z" fill="#ff8fb5" stroke="#e06a94" stroke-width="2.5" stroke-linejoin="round"/>
          <circle r="6.5" fill="#ffb3cd" stroke="#e06a94" stroke-width="2.5"/>
        </g>

        <!-- машущая лапка -->
        <g class="part k-arm">
          <rect x="177" y="128" width="26" height="86" rx="13" fill="url(#gFur)" stroke="var(--fur-line)" stroke-width="3"/>
          <circle cx="190" cy="128" r="19" fill="#ffd9bd" stroke="var(--fur-line)" stroke-width="3"/>
          <ellipse cx="190" cy="134" rx="7.5" ry="6" fill="var(--bean)"/>
          <circle cx="181" cy="123" r="3.4" fill="var(--bean)"/>
          <circle cx="190" cy="119.5" r="3.6" fill="var(--bean)"/>
          <circle cx="199" cy="123" r="3.4" fill="var(--bean)"/>
        </g>
      </svg>
    </div>

    <form class="join card" id="joinForm" novalidate autocomplete="off">
      <label class="join-q" for="joinName" data-i18n="whatName"></label>
      <input class="field big" id="joinName" name="name" maxlength="24" data-i18n-ph="namePh" autocomplete="off" enterkeyhint="next">
      <label class="field-label" for="joinCode" data-i18n="codeLabel"></label>
      <input class="field big code" id="joinCode" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" data-i18n-ph="codePh" autocomplete="off" enterkeyhint="go">
      <p class="form-error" id="joinError" role="alert"></p>
      <button class="btn primary huge" type="submit" id="joinBtn" data-i18n="join"></button>
    </form>

    <a class="teacher-link" href="/teacher" data-i18n="forTeacher"></a>
  </section>

  <!-- Динамические экраны: комната ожидания, гонка, результаты, кабинет учителя -->
  <section class="view stage" data-view="stage" id="stage"></section>
</main>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/socket.io/socket.io.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
